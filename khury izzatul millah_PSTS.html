```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Computer Lab Reservation</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-700 text-white text-center py-6">
        <h1 class="text-3xl font-bold">Computer Lab Reservation</h1>
        <p class="mt-2">School Student Creativity Festival Registration System</p>
    </header>

    <!-- Main Form -->
    <main class="max-w-3xl mx-auto px-4 py-8">

        <div class="bg-white rounded-xl shadow-lg p-6 md:p-8">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Reservation Form
            </h2>

            <form class="space-y-5">

                <!-- Borrower's Name -->
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Borrower's Name
                    </label>

                    <input
                        type="text"
                        placeholder="Name"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                </div>

                <!-- Class  -->
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Class
                    </label>

                    <div class="flex flex-wrap gap-5">
                        <label class="flex items-center gap-2">
                            <input type="radio" name="status" value="X">
                            X
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="status" value="XI">
                            XI
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="status" value="XII">
                            XII
                        </label>
                    </div>
                </div>

                <!-- Gender -->
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Gender
                    </label>

                    <input
                        type="text"
                        placeholder="Male.Female"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                </div>

                <!-- Competition Category -->
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Borrowed Lab
                    </label>

                    <select
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                        <option value="">Webdevelopen,loT prijec, Grapihc desine,public speaking, photography</option>
                        <option value="Lab 1">Lab 1 (Software)</option>
                        <option value="Lab 2">Lab 2 (Hardware)</option>
                    </select>
                </div>

                <!-- Prticipation Type -->
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Date of Use
                    </label>

                    <input
                        type="date"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                </div>

                <!-- Time -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div>
                        <label class="block font-medium text-gray-700 mb-2">
                            Start Time
                        </label>

                        <input
                            type="time"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required
                        >
                    </div>

                    <div>
                        <label class="block font-medium text-gray-700 mb-2">
                            End Time
                        </label>

                        <input
                            type="time"
                            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required
                        >
                    </div>

                </div>

                <!-- Number of Participants -->
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Number of Participants
                    </label>

                    <input
                        type="number"
                        min="1"
                        placeholder="Enter number of participants"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        required
                    >
                </div>

                <!-- Special Requirements -->
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Special Requirements
                    </label>

                    <textarea
                        rows="4"
                        placeholder="Need internet access, need a projector, etc."
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-3">

                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-800 transition duration-300"
                    >
                        Submit Reservation
                    </button>

                </div>

            </form>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-gray-500 py-5">
        <p>© 2026 School Computer Lab</p>
    </footer>

</body>
</html>
```
